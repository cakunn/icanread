openapi: 3.1.0
info:
  title: I Can Read API
  version: 0.1.0
servers:
  - url: /v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /me:
    get:
      operationId: getCurrentParent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current parent and household
  /children:
    post:
      operationId: createChild
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildProfileInput"
      responses:
        "201":
          description: Child created
  /children/{childId}/profile:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    get:
      operationId: getChildProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Child profile
    put:
      operationId: updateChildProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildProfileInput"
      responses:
        "200":
          description: Child profile updated
  /children/{childId}/consent:
    parameters:
      - $ref: "#/components/parameters/ChildId"
    put:
      operationId: updateChildConsent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "200":
          description: Consent updated
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status, apiVersion]
      properties:
        status:
          type: string
          const: ok
        apiVersion:
          type: string
    ChildProfileInput:
      type: object
      required: [firstName, age, interests, accessibilityPreferences]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 60
        age:
          type: integer
          minimum: 4
          maximum: 10
        interests:
          type: array
          minItems: 1
          items:
            type: string
        accessibilityPreferences:
          type: object
          additionalProperties: true
    ConsentInput:
      type: object
      required:
        [microphoneProcessing, cloudAIProcessing, retainSelectedAudio, policyVersion]
      properties:
        microphoneProcessing:
          type: boolean
        cloudAIProcessing:
          type: boolean
        retainSelectedAudio:
          type: boolean
        policyVersion:
          type: string
